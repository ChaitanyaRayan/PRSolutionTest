<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Beverage Category Intelligence · Constellation Brands × Molson Coors</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@300;400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  :root {
    /* Light beverage palette - cream, amber, sage, wine */
    --cream-100: #FBF8F1;
    --cream-200: #F5EFE3;
    --cream-300: #ECE3D2;
    --cream-400: #DDD0B8;
    --paper: #FEFCF7;

    --espresso: #2C2419;
    --coffee: #4A3D2C;
    --sand: #8A7965;
    --mist: #B5A691;

    --amber: #C8842E;        /* whiskey / lager */
    --amber-deep: #9E6420;
    --amber-soft: #E8C76D;
    --gold: #D4A857;
    --gold-light: #F1DCA0;

    --sage: #8B9A7B;
    --sage-deep: #5F6E51;
    --sage-mist: #C9D2BD;

    --wine: #7C3F4A;
    --wine-soft: #B6757F;
    --wine-mist: #E8CBCF;

    --rose: #D89C9C;
    --berry: #A85B5B;

    /* Brand colors */
    --cb: #C8842E;           /* Constellation Brands - whiskey amber */
    --cb-soft: #E8C76D;
    --cb-light: #F8EDD2;
    --mc: #5F7A8F;           /* Molson Coors - slate cool */
    --mc-soft: #9DB3C4;
    --mc-light: #E3EDF3;

    /* Sentiment */
    --pos: #6B8E5A;
    --pos-light: #D7E0CB;
    --neu: #B59B6F;
    --neu-light: #ECDFC7;
    --neg: #B5564E;
    --neg-light: #F0D2CE;

    --shadow-soft: 0 1px 3px rgba(44,36,25,0.04), 0 8px 24px rgba(44,36,25,0.06);
    --shadow-card: 0 1px 2px rgba(44,36,25,0.03), 0 12px 36px rgba(44,36,25,0.08);
    --shadow-elev: 0 4px 12px rgba(44,36,25,0.08), 0 24px 60px rgba(44,36,25,0.12);
  }

  * { box-sizing: border-box; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Inter', sans-serif;
    background: var(--cream-100);
    color: var(--espresso);
    overflow-x: hidden;
    background-image:
      radial-gradient(at 12% 8%, rgba(232,199,109,0.18), transparent 50%),
      radial-gradient(at 88% 92%, rgba(139,154,123,0.12), transparent 55%),
      radial-gradient(at 50% 50%, rgba(200,132,46,0.04), transparent 70%);
  }

  /* Subtle paper grain */
  body::before {
    content: '';
    position: fixed; inset: 0;
    pointer-events: none;
    z-index: 1;
    opacity: 0.35;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/%3E%3CfeColorMatrix values='0 0 0 0 0.4 0 0 0 0 0.35 0 0 0 0 0.28 0 0 0 0.08 0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  }

  .shell { position: relative; z-index: 2; }

  /* ============ HERO ============ */
  .hero {
    position: relative;
    height: 520px;
    overflow: hidden;
    border-bottom: 1px solid var(--cream-300);
    background: #1A1409;
  }
  #heroVideo {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    z-index: 1;
    filter: contrast(1.05) saturate(1.05);
    will-change: transform;
  }
  .hero-tint {
    position: absolute; inset: 0; z-index: 2;
    background:
      linear-gradient(90deg,
        rgba(18,14,8,0.85) 0%,
        rgba(18,14,8,0.72) 25%,
        rgba(18,14,8,0.40) 50%,
        rgba(18,14,8,0.12) 75%,
        rgba(18,14,8,0.00) 100%);
    pointer-events: none;
  }
  .hero-overlay {
    position: absolute; inset: 0; z-index: 4;
    background:
      linear-gradient(180deg,
        rgba(18,14,8,0.15) 0%,
        transparent 25%,
        transparent 70%,
        rgba(251,248,241,0.32) 100%);
    pointer-events: none;
  }
  .hero-vignette {
    position: absolute; inset: 0; z-index: 4;
    background: radial-gradient(ellipse at 25% 50%, transparent 45%, rgba(18,14,8,0.20) 100%);
    pointer-events: none;
  }
  .hero-inner {
    position: relative; z-index: 5;
    height: 100%;
    max-width: 1480px; margin: 0 auto;
    padding: 48px 56px;
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .hero-top { display: flex; justify-content: space-between; align-items: flex-start; }
  .brand-mark {
    display: flex; align-items: center; gap: 14px;
    color: var(--paper);
  }
  .logo-glyph {
    width: 44px; height: 44px;
    background: linear-gradient(135deg, var(--amber) 0%, var(--gold) 100%);
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    color: var(--paper);
    font-family: 'Fraunces', serif; font-weight: 700; font-size: 22px;
    box-shadow: 0 8px 28px rgba(200,132,46,0.55), 0 0 0 1px rgba(255,255,255,0.12);
    position: relative;
  }
  .logo-glyph::after {
    content: ''; position: absolute; inset: 2px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.4);
  }
  .brand-mark-text { display: flex; flex-direction: column; gap: 2px; }
  .brand-mark-text .name { font-family: 'Fraunces', serif; font-weight: 600; font-size: 18px; letter-spacing: -0.01em; color: var(--paper); text-shadow: 0 2px 12px rgba(0,0,0,0.4); }
  .brand-mark-text .tag { font-size: 11px; letter-spacing: 0.18em; color: var(--gold-light); text-transform: uppercase; }

  .hero-meta { display: flex; gap: 28px; align-items: center; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: rgba(254,252,247,0.85); }
  .meta-item { display: flex; align-items: center; gap: 8px; }
  .meta-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 12px rgba(212,168,87,0.7); animation: pulse 2.4s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 0.4; transform: scale(0.9); } 50% { opacity: 1; transform: scale(1.1); } }

  .hero-headline {
    display: flex; flex-direction: column; gap: 18px;
    max-width: 900px;
  }
  .hero-eyebrow {
    display: inline-flex; align-items: center; gap: 10px;
    font-size: 11px; letter-spacing: 0.24em; text-transform: uppercase; color: var(--gold-light);
    font-weight: 600;
  }
  .hero-eyebrow::before { content: ''; width: 28px; height: 1px; background: var(--gold); }
  .hero-title {
    font-family: 'Fraunces', serif;
    font-size: clamp(48px, 6vw, 88px);
    line-height: 0.96;
    letter-spacing: -0.025em;
    font-weight: 400;
    color: var(--paper);
    margin: 0;
    text-shadow: 0 4px 32px rgba(0,0,0,0.5), 0 1px 4px rgba(0,0,0,0.3);
  }
  .hero-title em {
    font-style: italic;
    font-family: 'Instrument Serif', serif;
    color: var(--gold);
    font-weight: 400;
  }
  .hero-sub {
    font-size: 16px; line-height: 1.6;
    color: rgba(254,252,247,0.92);
    max-width: 600px;
    margin: 0;
    text-shadow: 0 2px 12px rgba(0,0,0,0.4);
  }
  .hero-sub strong { color: var(--gold-light); }

  .hero-stats {
    display: flex; gap: 32px; align-items: flex-end;
    padding-top: 24px;
    border-top: 1px solid rgba(254,252,247,0.18);
  }
  .hero-stat { display: flex; flex-direction: column; gap: 4px; }
  .hero-stat .value { font-family: 'Fraunces', serif; font-size: 32px; font-weight: 500; letter-spacing: -0.02em; color: var(--paper); text-shadow: 0 2px 16px rgba(0,0,0,0.4); }
  .hero-stat .value em { font-style: italic; font-family: 'Instrument Serif', serif; color: var(--gold); }
  .hero-stat .label { font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(254,252,247,0.7); }

  /* ============ TAB NAV ============ */
  .tab-nav-wrap {
    position: sticky; top: 0; z-index: 100;
    background: rgba(251,248,241,0.92);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--cream-300);
  }
  .tab-nav {
    max-width: 1480px; margin: 0 auto;
    padding: 0 56px;
    display: flex; align-items: center; gap: 4px;
    overflow-x: auto;
  }
  .tab-btn {
    background: transparent; border: 0;
    padding: 20px 22px;
    font-family: 'Inter', sans-serif;
    font-size: 12px; font-weight: 500;
    letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--sand);
    cursor: pointer;
    position: relative;
    white-space: nowrap;
    transition: color 0.25s ease;
    display: flex; align-items: center; gap: 10px;
  }
  .tab-btn .tab-num {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 14px;
    color: var(--mist);
    transition: color 0.25s ease;
  }
  .tab-btn:hover { color: var(--coffee); }
  .tab-btn:hover .tab-num { color: var(--amber); }
  .tab-btn.active { color: var(--espresso); }
  .tab-btn.active .tab-num { color: var(--amber-deep); }
  .tab-btn.active::after {
    content: '';
    position: absolute; left: 22px; right: 22px; bottom: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--amber), var(--gold));
    border-radius: 2px;
  }

  /* ============ TAB CONTENT ============ */
  .tab-panel {
    display: none;
    max-width: 1480px;
    margin: 0 auto;
    padding: 48px 56px 72px;
    animation: fadeUp 0.6s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .tab-panel.active { display: block; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ============ STORYBOARD CARDS ============ */
  .story-card {
    position: relative;
    background: linear-gradient(135deg, var(--paper) 0%, var(--cream-200) 100%);
    border: 1px solid var(--cream-300);
    border-radius: 24px;
    padding: 36px 44px;
    margin-bottom: 36px;
    box-shadow: var(--shadow-soft);
    overflow: hidden;
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 28px;
    align-items: center;
  }
  .story-card.intro {
    background: linear-gradient(120deg, var(--cream-200) 0%, var(--paper) 60%, var(--cream-200) 100%);
  }
  .story-card.outro {
    background: linear-gradient(120deg, var(--paper) 0%, var(--cream-200) 60%, var(--paper) 100%);
    margin-top: 40px; margin-bottom: 0;
  }
  .story-card::before {
    content: ''; position: absolute; top: 0; left: 0; bottom: 0;
    width: 4px;
    background: linear-gradient(180deg, var(--amber), var(--gold), var(--sage));
  }
  .story-icon {
    width: 64px; height: 64px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--gold-light), var(--cream-300));
    display: flex; align-items: center; justify-content: center;
    border: 1px solid var(--cream-400);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.7), 0 4px 12px rgba(200,132,46,0.15);
  }
  .story-icon svg { width: 28px; height: 28px; color: var(--amber-deep); }
  .story-content { display: flex; flex-direction: column; gap: 8px; }
  .story-eyebrow {
    font-size: 10px; letter-spacing: 0.24em; text-transform: uppercase;
    color: var(--amber-deep); font-weight: 600;
  }
  .story-title { font-family: 'Fraunces', serif; font-size: 26px; font-weight: 500; letter-spacing: -0.02em; line-height: 1.15; margin: 0; }
  .story-title em { font-style: italic; font-family: 'Instrument Serif', serif; color: var(--amber-deep); font-weight: 400; }
  .story-text { font-size: 14px; line-height: 1.55; color: var(--coffee); margin: 0; max-width: 720px; }

  .story-nav {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
  }
  .next-btn {
    background: var(--espresso); color: var(--paper);
    border: 0; border-radius: 999px;
    padding: 14px 26px;
    font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 500;
    letter-spacing: 0.14em; text-transform: uppercase;
    cursor: pointer;
    display: flex; align-items: center; gap: 10px;
    transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
    box-shadow: 0 4px 16px rgba(44,36,25,0.18);
  }
  .next-btn:hover { transform: translateX(4px); background: var(--amber-deep); box-shadow: 0 6px 24px rgba(158,100,32,0.28); }
  .next-btn .arrow { transition: transform 0.3s; }
  .next-btn:hover .arrow { transform: translateX(4px); }
  .next-label { font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--sand); }

  /* ============ KPI CARDS ============ */
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
    margin-bottom: 32px;
  }
  .kpi {
    background: var(--paper);
    border: 1px solid var(--cream-300);
    border-radius: 20px;
    padding: 28px;
    position: relative;
    overflow: hidden;
    transition: all 0.3s ease;
    cursor: default;
  }
  .kpi:hover { transform: translateY(-3px); box-shadow: var(--shadow-card); border-color: var(--amber-soft); }
  .kpi::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0;
    height: 3px;
    background: var(--brand-color, var(--amber));
    opacity: 0.6;
  }
  .kpi.cb { --brand-color: var(--cb); }
  .kpi.mc { --brand-color: var(--mc); }
  .kpi-label {
    font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--sand); font-weight: 500;
    display: flex; align-items: center; gap: 8px;
  }
  .kpi-label .pill {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 9px; letter-spacing: 0.1em;
    background: var(--brand-color, var(--amber));
    color: var(--paper);
  }
  .kpi-value {
    font-family: 'Fraunces', serif;
    font-size: 42px;
    font-weight: 500;
    letter-spacing: -0.025em;
    color: var(--espresso);
    margin: 8px 0 4px;
    line-height: 1;
  }
  .kpi-sub { font-size: 12px; color: var(--coffee); }
  .kpi-sub em { font-style: normal; color: var(--amber-deep); font-weight: 500; }

  /* Section headers */
  .section-head {
    display: flex; align-items: baseline; justify-content: space-between;
    margin: 40px 0 20px;
  }
  .section-title {
    font-family: 'Fraunces', serif;
    font-size: 28px;
    font-weight: 500;
    letter-spacing: -0.02em;
    margin: 0;
    color: var(--espresso);
  }
  .section-title em { font-style: italic; font-family: 'Instrument Serif', serif; color: var(--amber-deep); font-weight: 400; }
  .section-eyebrow { font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--sand); font-weight: 500; }

  /* Chart cards */
  .chart-card {
    background: var(--paper);
    border: 1px solid var(--cream-300);
    border-radius: 20px;
    padding: 28px;
    box-shadow: var(--shadow-soft);
    position: relative;
  }
  .chart-card-head {
    display: flex; align-items: flex-start; justify-content: space-between;
    margin-bottom: 20px;
  }
  .chart-card-title { font-family: 'Fraunces', serif; font-size: 20px; font-weight: 500; letter-spacing: -0.01em; margin: 0; color: var(--espresso); }
  .chart-card-sub { font-size: 12px; color: var(--sand); margin: 4px 0 0; letter-spacing: 0.04em; }
  .click-hint {
    font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--amber-deep);
    background: var(--gold-light);
    padding: 5px 10px;
    border-radius: 999px;
    display: inline-flex; align-items: center; gap: 6px;
    font-weight: 500;
    animation: gentlePulse 2.5s ease-in-out infinite;
  }
  @keyframes gentlePulse { 0%, 100% { opacity: 0.85; } 50% { opacity: 1; transform: scale(1.02); } }
  .click-hint .dot { width: 6px; height: 6px; background: var(--amber); border-radius: 50%; }

  .chart-wrap { position: relative; height: 320px; }
  .chart-wrap.tall { height: 380px; }
  .chart-wrap.short { height: 220px; }

  /* Two-column layouts */
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  .three-col { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }

  /* ============ INSIGHT MODAL ============ */
  .modal-backdrop {
    position: fixed; inset: 0; z-index: 200;
    background: rgba(44,36,25,0.45);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    display: none;
    align-items: center; justify-content: center;
    padding: 24px;
    animation: fadeIn 0.25s ease;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .modal-backdrop.open { display: flex; }
  .modal {
    background: var(--paper);
    border-radius: 24px;
    border: 1px solid var(--cream-300);
    max-width: 640px; width: 100%;
    max-height: 85vh; overflow-y: auto;
    box-shadow: var(--shadow-elev);
    position: relative;
    overflow: hidden;
    animation: modalUp 0.4s cubic-bezier(0.22, 1, 0.36, 1);
  }
  @keyframes modalUp { from { opacity: 0; transform: translateY(28px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
  .modal-shader {
    height: 80px;
    background: linear-gradient(135deg, var(--gold-light), var(--cream-300), var(--sage-mist));
    position: relative;
    overflow: hidden;
  }
  .modal-shader::before {
    content: ''; position: absolute; inset: 0;
    background:
      radial-gradient(circle at 20% 50%, rgba(212,168,87,0.4), transparent 50%),
      radial-gradient(circle at 80% 30%, rgba(139,154,123,0.3), transparent 50%);
  }
  .modal-body { padding: 32px 36px 36px; }
  .modal-eyebrow {
    font-size: 10px; letter-spacing: 0.24em; text-transform: uppercase;
    color: var(--amber-deep); font-weight: 600;
    display: flex; align-items: center; gap: 10px;
  }
  .modal-eyebrow .ai-badge {
    background: var(--espresso); color: var(--gold-light);
    padding: 3px 9px; border-radius: 6px;
    font-size: 9px; letter-spacing: 0.18em;
  }
  .modal-title {
    font-family: 'Fraunces', serif;
    font-size: 28px;
    font-weight: 500;
    letter-spacing: -0.02em;
    line-height: 1.2;
    margin: 14px 0 8px;
  }
  .modal-title em { font-style: italic; font-family: 'Instrument Serif', serif; color: var(--amber-deep); }
  .modal-meta { display: flex; gap: 16px; margin: 8px 0 22px; flex-wrap: wrap; }
  .modal-meta-item {
    background: var(--cream-200);
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 11px;
    color: var(--coffee);
    letter-spacing: 0.04em;
  }
  .modal-meta-item strong { color: var(--espresso); font-weight: 600; }
  .modal-section { margin: 18px 0; }
  .modal-section-title {
    font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--sand); font-weight: 600;
    margin: 0 0 10px;
    display: flex; align-items: center; gap: 8px;
  }
  .modal-section-title::before { content: ''; width: 16px; height: 1px; background: var(--amber); }
  .modal-section-text {
    font-size: 14px; line-height: 1.65; color: var(--coffee); margin: 0;
  }
  .modal-section-text strong { color: var(--espresso); }
  .modal-close {
    position: absolute; top: 16px; right: 16px;
    width: 32px; height: 32px;
    background: rgba(254,252,247,0.9);
    border: 1px solid var(--cream-300);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    color: var(--coffee);
    transition: all 0.2s;
    z-index: 2;
  }
  .modal-close:hover { background: var(--paper); color: var(--espresso); transform: scale(1.08); }

  /* ============ TAB 1 - BRAND BATTLE ============ */
  .battle-grid {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 32px;
    align-items: stretch;
    margin: 32px 0;
  }
  .battle-side {
    background: var(--paper);
    border: 1px solid var(--cream-300);
    border-radius: 24px;
    padding: 32px;
    position: relative;
    overflow: hidden;
    transition: all 0.4s ease;
  }
  .battle-side.cb {
    background: linear-gradient(160deg, var(--cb-light) 0%, var(--paper) 60%);
    border-color: rgba(200,132,46,0.25);
  }
  .battle-side.mc {
    background: linear-gradient(160deg, var(--mc-light) 0%, var(--paper) 60%);
    border-color: rgba(95,122,143,0.25);
  }
  .battle-side::before {
    content: ''; position: absolute; top: -40px; right: -40px;
    width: 200px; height: 200px;
    border-radius: 50%;
    opacity: 0.06;
    background: var(--brand-color);
  }
  .battle-side.cb { --brand-color: var(--cb); }
  .battle-side.mc { --brand-color: var(--mc); }
  .battle-side-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 18px;
  }
  .brand-tag {
    display: inline-flex; align-items: center; gap: 10px;
    font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--coffee);
    font-weight: 600;
  }
  .brand-tag .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--brand-color);
    box-shadow: 0 0 0 4px rgba(200,132,46,0.15);
  }
  .battle-side.mc .brand-tag .dot { box-shadow: 0 0 0 4px rgba(95,122,143,0.15); }
  .brand-tag .scope { color: var(--sand); font-weight: 400; letter-spacing: 0.1em; }
  .battle-name {
    font-family: 'Fraunces', serif;
    font-size: 32px;
    font-weight: 500;
    letter-spacing: -0.02em;
    margin: 0 0 4px;
    color: var(--espresso);
  }
  .battle-name em { font-style: italic; font-family: 'Instrument Serif', serif; }
  .battle-tagline { font-size: 12px; color: var(--sand); font-style: italic; margin: 0 0 24px; font-family: 'Fraunces', serif; }

  .battle-stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin-bottom: 20px; }
  .battle-stat {
    background: rgba(254,252,247,0.6);
    border: 1px solid var(--cream-300);
    border-radius: 14px;
    padding: 16px;
  }
  .battle-stat .lbl { font-size: 9px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--sand); font-weight: 500; }
  .battle-stat .val { font-family: 'Fraunces', serif; font-size: 28px; font-weight: 500; color: var(--espresso); margin-top: 4px; letter-spacing: -0.02em; }
  .battle-stat .delta { font-size: 11px; margin-top: 4px; color: var(--coffee); }
  .battle-stat .delta.win { color: var(--pos); font-weight: 500; }
  .battle-stat .delta.lose { color: var(--neg); font-weight: 500; }

  .battle-sub { padding-top: 16px; border-top: 1px solid var(--cream-300); }
  .battle-sub-title { font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--sand); margin-bottom: 10px; font-weight: 500; }
  .battle-sub-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .sub-chip {
    background: var(--paper);
    border: 1px solid var(--cream-300);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 12px;
    color: var(--coffee);
    display: flex; align-items: center; justify-content: space-between;
  }
  .sub-chip strong { font-family: 'Fraunces', serif; font-weight: 600; color: var(--espresso); }
  .sub-chip .num { color: var(--amber-deep); font-family: 'Fraunces', serif; font-size: 14px; }

  /* Versus divider */
  .battle-versus {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 16px;
    padding: 24px 8px;
  }
  .vs-circle {
    width: 80px; height: 80px;
    background: var(--espresso);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: var(--gold-light);
    font-family: 'Instrument Serif', serif;
    font-size: 36px; font-style: italic;
    box-shadow: 0 12px 36px rgba(44,36,25,0.25);
    position: relative;
    animation: vsBreath 4s ease-in-out infinite;
  }
  @keyframes vsBreath { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
  .vs-circle::before {
    content: ''; position: absolute; inset: -8px;
    border: 1px dashed var(--mist);
    border-radius: 50%;
    animation: vsRotate 24s linear infinite;
  }
  @keyframes vsRotate { to { transform: rotate(360deg); } }
  .vs-label {
    font-size: 9px; letter-spacing: 0.32em; text-transform: uppercase;
    color: var(--sand);
    writing-mode: vertical-rl; text-orientation: mixed;
  }

  /* Scorecard / Vote section */
  .scorecard {
    background: var(--paper);
    border: 1px solid var(--cream-300);
    border-radius: 20px;
    padding: 32px;
    box-shadow: var(--shadow-soft);
    margin-top: 24px;
  }
  .scorecard-head {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 24px;
  }
  .scorecard-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
  .vote-card {
    background: var(--cream-200);
    border: 1px solid var(--cream-300);
    border-radius: 14px;
    padding: 18px;
    text-align: center;
    cursor: pointer;
    transition: all 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    position: relative;
    overflow: hidden;
  }
  .vote-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-card); }
  .vote-card.revealed { background: var(--paper); }
  .vote-card.revealed.winner-cb {
    background: linear-gradient(160deg, var(--cb-light), var(--paper));
    border-color: var(--cb);
  }
  .vote-card.revealed.winner-mc {
    background: linear-gradient(160deg, var(--mc-light), var(--paper));
    border-color: var(--mc);
  }
  .vc-metric { font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--sand); font-weight: 500; margin-bottom: 8px; }
  .vc-prompt { font-family: 'Fraunces', serif; font-size: 14px; color: var(--coffee); font-style: italic; }
  .vc-reveal { display: none; }
  .vote-card.revealed .vc-prompt { display: none; }
  .vote-card.revealed .vc-reveal { display: block; }
  .vc-winner {
    font-family: 'Fraunces', serif;
    font-size: 22px; font-weight: 500;
    margin: 4px 0;
    color: var(--espresso);
  }
  .vc-detail { font-size: 11px; color: var(--coffee); line-height: 1.4; }
  .vc-tap { font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--amber-deep); margin-top: 10px; opacity: 0.8; }

  /* ============ TAB 2 - TIMELINE ============ */
  .timeline-wrap { position: relative; }
  .week-cards-row {
    display: grid;
    grid-template-columns: repeat(13, 1fr);
    gap: 4px;
    margin-top: 20px;
  }
  .week-card {
    background: var(--paper);
    border: 1px solid var(--cream-300);
    border-radius: 10px;
    padding: 12px 8px;
    text-align: center;
    cursor: pointer;
    transition: all 0.3s ease;
    font-size: 10px;
  }
  .week-card:hover { transform: translateY(-2px); border-color: var(--amber-soft); box-shadow: var(--shadow-soft); }
  .week-card.active { background: var(--gold-light); border-color: var(--amber); }
  .week-card .wlbl { font-size: 9px; color: var(--sand); letter-spacing: 0.08em; text-transform: uppercase; }
  .week-card .wval { font-family: 'Fraunces', serif; font-size: 16px; font-weight: 500; color: var(--espresso); margin-top: 4px; }
  .week-detail {
    background: var(--paper);
    border: 1px solid var(--cream-300);
    border-radius: 20px;
    padding: 24px 28px;
    margin-top: 16px;
    display: flex;
    align-items: center; gap: 28px;
    transition: all 0.3s ease;
  }
  .wd-circle {
    width: 84px; height: 84px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--gold-light), var(--cream-300));
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: var(--espresso);
    flex-shrink: 0;
    border: 1px solid var(--cream-400);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.7);
  }
  .wd-circle .num { font-family: 'Fraunces', serif; font-size: 22px; font-weight: 600; line-height: 1; }
  .wd-circle .lbl { font-size: 9px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--coffee); margin-top: 2px; }
  .wd-content { flex: 1; }
  .wd-week { font-family: 'Fraunces', serif; font-size: 22px; font-weight: 500; letter-spacing: -0.01em; margin: 0; }
  .wd-week em { font-style: italic; color: var(--amber-deep); }
  .wd-story { font-size: 13px; line-height: 1.55; color: var(--coffee); margin: 6px 0 0; }
  .wd-metrics { display: flex; gap: 24px; margin-top: 12px; }
  .wd-metric { display: flex; flex-direction: column; gap: 2px; }
  .wd-metric .v { font-family: 'Fraunces', serif; font-size: 18px; font-weight: 500; }
  .wd-metric .l { font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--sand); }

  /* ============ TAB 3 - CHANNELS / FLIP CARD ============ */
  /* Brand-divided sections */
  .channel-brand-section {
    margin-top: 28px;
    padding: 24px 24px 28px;
    border-radius: 22px;
    position: relative;
    overflow: hidden;
  }
  .cb-section {
    background: linear-gradient(160deg, rgba(241,220,160,0.30) 0%, rgba(212,168,87,0.10) 60%, rgba(254,252,247,0.4) 100%);
    border: 1px solid rgba(200,132,46,0.22);
  }
  .mc-section {
    background: linear-gradient(160deg, rgba(220,231,238,0.55) 0%, rgba(157,179,196,0.18) 60%, rgba(254,252,247,0.4) 100%);
    border: 1px solid rgba(95,122,143,0.22);
  }
  .channel-brand-section::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; height: 4px;
  }
  .cb-section::before { background: linear-gradient(90deg, var(--amber), var(--gold)); }
  .mc-section::before { background: linear-gradient(90deg, var(--mc), #7E96A8); }

  .cbs-header {
    display: flex; align-items: center; gap: 20px;
    margin-bottom: 22px;
    flex-wrap: wrap;
  }
  .cbs-mark {
    width: 52px; height: 52px;
    border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Fraunces', serif;
    font-size: 18px; font-weight: 600;
    color: var(--paper);
    letter-spacing: 0.02em;
    flex-shrink: 0;
  }
  .cbs-mark.cb { background: linear-gradient(160deg, var(--gold), var(--amber)); box-shadow: 0 6px 18px rgba(200,132,46,0.3); }
  .cbs-mark.mc { background: linear-gradient(160deg, #7E96A8, var(--mc)); box-shadow: 0 6px 18px rgba(95,122,143,0.3); }
  .cbs-eyebrow {
    font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--coffee); font-weight: 600;
    opacity: 0.75;
  }
  .cbs-title {
    font-family: 'Fraunces', serif;
    font-size: 26px; font-weight: 500;
    margin: 4px 0 0;
    letter-spacing: -0.02em;
    color: var(--espresso);
  }
  .cb-section .cbs-title em { font-style: italic; font-family: 'Instrument Serif', serif; color: var(--amber-deep); font-weight: 400; }
  .mc-section .cbs-title em { font-style: italic; font-family: 'Instrument Serif', serif; color: var(--mc); font-weight: 400; }
  .cbs-stat {
    margin-left: auto;
    text-align: right;
    padding-left: 22px;
    border-left: 1px solid rgba(140,121,91,0.18);
  }
  .cbs-stat:nth-of-type(2) { margin-left: 0; }
  .cbs-stat-val {
    font-family: 'Fraunces', serif;
    font-size: 22px; font-weight: 500;
    color: var(--espresso);
    line-height: 1;
  }
  .cbs-stat-lbl {
    font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--sand); margin-top: 4px;
  }

  .channel-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
  }
  .channel-card {
    perspective: 1200px;
    cursor: pointer;
    height: 210px;
    position: relative;
  }
  .ch-inner {
    position: relative;
    width: 100%; height: 100%;
    transform-style: preserve-3d;
    transition: transform 0.7s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .channel-card.flipped .ch-inner { transform: rotateY(180deg); }
  .ch-face {
    position: absolute; inset: 0;
    padding: 22px 20px 20px;
    -webkit-backface-visibility: hidden;
    backface-visibility: hidden;
    border-radius: 16px;
    display: flex; flex-direction: column; justify-content: space-between;
    overflow: hidden;
  }
  .ch-front {
    background: var(--paper);
    border: 1px solid var(--cream-300);
    box-shadow: 0 1px 3px rgba(44,36,25,0.03);
    transition: box-shadow 0.3s, transform 0.3s;
  }
  /* Brand-specific tint and stripe on the FRONT face */
  .channel-card[data-brand="cb"] .ch-front {
    background: linear-gradient(180deg, rgba(241,220,160,0.18) 0%, var(--paper) 35%);
    border-color: rgba(200,132,46,0.30);
  }
  .channel-card[data-brand="mc"] .ch-front {
    background: linear-gradient(180deg, rgba(220,231,238,0.55) 0%, var(--paper) 35%);
    border-color: rgba(95,122,143,0.30);
  }
  .ch-front::before {
    content: '';
    position: absolute;
    top: 0; left: 0; bottom: 0;
    width: 4px;
  }
  .channel-card[data-brand="cb"] .ch-front::before {
    background: linear-gradient(180deg, var(--amber), var(--gold));
  }
  .channel-card[data-brand="mc"] .ch-front::before {
    background: linear-gradient(180deg, var(--mc), #7E96A8);
  }
  .channel-card:hover .ch-front { box-shadow: var(--shadow-soft); }
  .ch-back {
    transform: rotateY(180deg);
    background: linear-gradient(160deg, #FBF8F1, #F5EFE0 60%, #ECDCB4);
    border: 1px solid var(--cream-400);
    box-shadow: var(--shadow-card);
  }
  .ch-back.cb-back { background: linear-gradient(160deg, #FBF8F1, #F1DCA0 70%, #D4A857); }
  .ch-back.mc-back { background: linear-gradient(160deg, #FBF8F1, #DCE7EE 70%, #9DB3C4); }
  .ch-front-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .ch-brand-pill {
    font-family: 'Fraunces', serif;
    font-size: 10px; font-weight: 600;
    letter-spacing: 0.08em;
    padding: 3px 8px;
    border-radius: 6px;
    color: var(--paper);
  }
  .ch-brand-pill.cb { background: var(--amber-deep); }
  .ch-brand-pill.mc { background: var(--mc); }
  .ch-icon { width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center; }
  .ch-icon svg { width: 20px; height: 20px; }
  .ch-fb { background: rgba(95,122,143,0.15); color: var(--mc); }
  .ch-ig { background: rgba(168,91,91,0.12); color: var(--berry); }
  .ch-tw { background: rgba(74,61,44,0.1); color: var(--coffee); }
  .ch-tv { background: rgba(200,132,46,0.15); color: var(--amber-deep); }
  .ch-tt { background: rgba(124,63,74,0.12); color: var(--wine); }
  .ch-li { background: rgba(95,122,143,0.15); color: var(--mc); }
  .ch-rd { background: rgba(139,154,123,0.15); color: var(--sage-deep); }
  .ch-vd { background: rgba(212,168,87,0.18); color: var(--amber-deep); }
  .ch-name { font-family: 'Fraunces', serif; font-size: 17px; font-weight: 500; margin: 12px 0 6px; letter-spacing: -0.01em; }
  .ch-share { font-size: 11.5px; color: var(--coffee); line-height: 1.55; }
  .ch-share strong { color: var(--espresso); font-weight: 600; }
  .ch-flip-hint {
    font-size: 9px; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--amber-deep); opacity: 0.6; font-weight: 600;
    padding: 4px 8px; background: var(--cream-200); border-radius: 999px;
  }
  .channel-card[data-brand="mc"] .ch-flip-hint { color: var(--mc); }
  .ch-back-title { font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--coffee); margin-bottom: 6px; font-weight: 600; }
  .ch-back-stat {
    font-family: 'Fraunces', serif; font-size: 36px; font-weight: 500;
    color: var(--espresso); letter-spacing: -0.02em; line-height: 1;
  }
  .ch-back-stat em { font-style: italic; font-family: 'Instrument Serif', serif; color: var(--sand); font-size: 18px; margin-left: 4px; }
  .ch-back-sub { font-size: 11px; color: var(--coffee); margin-top: 4px; }
  .ch-back-detail { font-size: 11px; color: var(--coffee); line-height: 1.5; margin-top: 8px; }
  .ch-back-detail strong { color: var(--espresso); }
  .ch-back-bar { height: 6px; background: rgba(254,252,247,0.6); border-radius: 3px; overflow: hidden; margin: 10px 0 6px; }
  .ch-back-bar-fill { height: 100%; background: linear-gradient(90deg, var(--amber), var(--gold)); border-radius: 3px; transition: width 1s ease; }
  .ch-back-flip-hint {
    position: absolute; top: 14px; right: 14px;
    font-size: 9px; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--coffee); opacity: 0.65; font-weight: 600;
  }

  /* ============ TAB 4 - SENTIMENT PULSE ============ */
  .pulse-section {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
  }
  .pulse-card {
    background: var(--paper);
    border: 1px solid var(--cream-300);
    border-radius: 20px;
    padding: 32px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .pulse-meter {
    width: 220px; height: 220px;
    margin: 20px auto;
    position: relative;
  }
  .pulse-percent {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    pointer-events: none;
  }
  .pulse-percent .num { font-family: 'Fraunces', serif; font-size: 48px; font-weight: 500; letter-spacing: -0.02em; }
  .pulse-percent .lbl { font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--sand); }
  .pulse-bars { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 16px; }
  .pulse-bar {
    background: var(--cream-200);
    border-radius: 12px;
    padding: 10px;
    text-align: left;
  }
  .pulse-bar.p { background: var(--pos-light); }
  .pulse-bar.n { background: var(--neg-light); }
  .pulse-bar.m { background: var(--neu-light); }
  .pulse-bar .lbl { font-size: 9px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--coffee); font-weight: 500; }
  .pulse-bar .val { font-family: 'Fraunces', serif; font-size: 20px; font-weight: 500; margin-top: 2px; }

  /* Quote cards */
  .quote-band {
    background: linear-gradient(160deg, var(--cream-200) 0%, var(--paper) 100%);
    border: 1px solid var(--cream-300);
    border-radius: 24px;
    padding: 36px 44px;
    margin-top: 24px;
    position: relative;
    overflow: hidden;
  }
  .quote-band::before {
    content: '"';
    position: absolute;
    top: -60px; left: 20px;
    font-family: 'Instrument Serif', serif;
    font-size: 320px;
    color: var(--gold-light);
    line-height: 1;
    opacity: 0.5;
    font-style: italic;
  }
  .quote-tabs { display: flex; gap: 6px; margin-bottom: 18px; flex-wrap: wrap; position: relative; z-index: 2; }
  .quote-tab {
    background: var(--paper);
    border: 1px solid var(--cream-300);
    padding: 8px 14px;
    border-radius: 999px;
    font-size: 11px;
    color: var(--coffee);
    cursor: pointer;
    transition: all 0.2s;
    font-weight: 500;
  }
  .quote-tab:hover { border-color: var(--amber-soft); }
  .quote-tab.active { background: var(--espresso); color: var(--paper); border-color: var(--espresso); }
  .quote-content { position: relative; z-index: 2; min-height: 140px; }
  .quote-text {
    font-family: 'Fraunces', serif;
    font-size: 22px;
    font-style: italic;
    line-height: 1.4;
    color: var(--espresso);
    margin: 0 0 16px;
    font-weight: 400;
  }
  .quote-attr { font-size: 12px; color: var(--coffee); }
  .quote-attr strong { color: var(--espresso); font-weight: 600; }
  .quote-tone {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase;
    margin-left: 8px;
    font-weight: 500;
  }
  .qt-pos { background: var(--pos-light); color: var(--sage-deep); }
  .qt-neg { background: var(--neg-light); color: var(--berry); }
  .qt-neu { background: var(--neu-light); color: var(--amber-deep); }

  /* ============ TAB 5 - SUB-BRAND ============ */
  .bubble-explorer {
    background: var(--paper);
    border: 1px solid var(--cream-300);
    border-radius: 20px;
    padding: 32px;
    box-shadow: var(--shadow-soft);
  }
  .be-canvas { position: relative; height: 460px; }
  .bubble {
    position: absolute;
    border-radius: 50%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    cursor: pointer;
    transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.3s;
    text-align: center;
    font-family: 'Fraunces', serif;
    color: var(--espresso);
    box-shadow: 0 6px 20px rgba(44,36,25,0.08);
    border: 1px solid rgba(255,255,255,0.6);
  }
  .bubble:hover { transform: scale(1.08); box-shadow: 0 16px 40px rgba(44,36,25,0.18); z-index: 10; }
  .bubble.cb-b { background: radial-gradient(circle at 30% 30%, var(--gold-light), var(--cb-soft) 65%, var(--cb)); }
  .bubble.mc-b { background: radial-gradient(circle at 30% 30%, #DCE7EE, var(--mc-soft) 65%, var(--mc)); }
  .bubble.active { transform: scale(1.12); z-index: 20; box-shadow: 0 24px 60px rgba(44,36,25,0.25); }
  .bubble-name { font-weight: 600; line-height: 1; padding: 0 4px; }

const fmt = {
  num: (n) => n.toLocaleString('en-US'),
  short: (n) => {
    if (n >= 1e9) return (n/1e9).toFixed(1) + 'B';
    if (n >= 1e6) return (n/1e6).toFixed(1) + 'M';
    if (n >= 1e3) return (n/1e3).toFixed(1) + 'K';
    return String(n);
  },
  pct: (n) => n.toFixed(1) + '%'
};

function initHeroVideo() {
  const v = document.getElementById('heroVideo');
  if (!v) return;
  try {
    v.src = 'data:video/mp4;base64,' + HERO_VIDEO_B64;
    v.playbackRate = 0.85;
    const tryPlay = () => v.play().catch(() => {});
    v.addEventListener('canplay', tryPlay, { once: true });
    tryPlay();
  } catch (e) { console.warn('hero video init failed', e); }
}

/* ============================================================
   LIQUID SHADER SYSTEM
   A reusable beer-froth/liquid-dynamics canvas painter used by:
     - Modal insight banner (themed per brand)
     - Story card circular "liquid badge" icon
   Single shared RAF loop iterates all registered canvases per frame.
*/
const _liquidCanvases = new Set();
let _liquidRunning = false;

function _liquidLoop(now) {
  for (const item of _liquidCanvases) {
    try { item.draw(now); } catch (e) { /* swallow */ }
  }
  if (_liquidCanvases.size > 0) requestAnimationFrame(_liquidLoop);
  else _liquidRunning = false;
}

function _ensureLiquidLoop() {
  if (_liquidRunning) return;
  _liquidRunning = true;
  requestAnimationFrame(_liquidLoop);
}

/* Theme palettes for the bubbles/foam/sparkles */
const LIQUID_THEMES = {
  cb:      { bubble: [255, 235, 175], foam: [255, 245, 215], sparkle: [255, 220, 150], caustic: [255, 215, 130] },
  mc:      { bubble: [220, 235, 245], foam: [240, 248, 255], sparkle: [200, 220, 240], caustic: [180, 210, 235] },
  neutral: { bubble: [255, 235, 195], foam: [252, 245, 225], sparkle: [255, 220, 160], caustic: [240, 215, 150] },
  pos:     { bubble: [220, 240, 200], foam: [230, 245, 215], sparkle: [200, 225, 175], caustic: [195, 220, 165] },
  neg:     { bubble: [245, 215, 210], foam: [250, 230, 225], sparkle: [220, 175, 165], caustic: [215, 165, 155] }
};

/* Register a canvas to be painted with the liquid shader.
   opts: { theme, bubbles, foam, sparkles, alpha, mode }
   mode: 'banner' (rising bubbles + caustics + foam top) or 'circle' (constrained, no foam, denser bubbles)
   Returns { stop } to detach.
*/
function paintLiquidShader(canvas, opts = {}) {
  if (!canvas) return { stop: () => {} };
  const ctx = canvas.getContext('2d');
  const DPR = Math.min(window.devicePixelRatio || 1, 2);
  const theme = LIQUID_THEMES[opts.theme] || LIQUID_THEMES.neutral;
  const mode = opts.mode || 'banner';
  const alpha = opts.alpha != null ? opts.alpha : 1.0;
  const N_BUB = opts.bubbles || (mode === 'circle' ? 14 : 60);
  const N_FOAM = opts.foam || (mode === 'circle' ? 0 : 14);
  const N_SPARK = opts.sparkles || (mode === 'circle' ? 8 : 22);

  let w = 0, h = 0, R = 0;
  let bubbles = [], foam = [], sparks = [];
  let lastT = 0;
  let t = Math.random() * 100;

  function rgba(c, a) { return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + (a * alpha).toFixed(3) + ')'; }

  function resize() {
    w = canvas.width = Math.max(1, canvas.clientWidth * DPR);
    h = canvas.height = Math.max(1, canvas.clientHeight * DPR);
    R = Math.min(w, h) / 2;
    /* (re)seed particles relative to size */
    bubbles = [];
    for (let i = 0; i < N_BUB; i++) {
      bubbles.push({
        x: Math.random() * w,
        y: h + Math.random() * h,
        r: (mode === 'circle' ? 1.2 + Math.random() * 2.6 : 1.4 + Math.random() * 4.0) * DPR,
        speed: (0.20 + Math.random() * 0.85) * DPR,
        sway: 0.5 + Math.random() * 1.2,
        swayPhase: Math.random() * Math.PI * 2,
        alpha: 0.22 + Math.random() * 0.55
      });
    }
    foam = [];
    for (let i = 0; i < N_FOAM; i++) {
      foam.push({
        cx: (i / Math.max(1, N_FOAM)) * w + (Math.random() - 0.5) * (w / N_FOAM) * 0.8,
        cy: (4 + Math.random() * (h * 0.35)) * 1,
        r: (h * 0.35 + Math.random() * h * 0.55),
        bob: 4 + Math.random() * 12,
        phase: Math.random() * Math.PI * 2,
        speed: 0.4 + Math.random() * 0.8,
        alpha: 0.10 + Math.random() * 0.22
      });
    }
    sparks = [];
    for (let i = 0; i < N_SPARK; i++) {
      sparks.push({ ph: Math.random() * Math.PI * 2, phY: Math.random() * Math.PI * 2 });
    }
  }
  resize();

  /* Throttled resize observer */
  let _ro;
  if (window.ResizeObserver) {
    _ro = new ResizeObserver(() => resize());
    _ro.observe(canvas);
  }

  /* For circle mode, clip to a circle so the shader looks like liquid inside a vessel */
  function applyClip() {
    if (mode !== 'circle') return;
    ctx.save();
    ctx.beginPath();
    ctx.arc(w / 2, h / 2, Math.min(w, h) / 2 - 1, 0, Math.PI * 2);
    ctx.clip();
  }
  function releaseClip() { if (mode === 'circle') ctx.restore(); }

  function draw(now) {
    if (!lastT) lastT = now;
    const dt = Math.min(50, now - lastT); /* ms */
    lastT = now;
    t += dt * 0.001;

    ctx.clearRect(0, 0, w, h);
    applyClip();

    /* === Caustic light bands (subtle horizontal ribbons) === */
    if (mode === 'banner') {
      ctx.strokeStyle = rgba(theme.caustic, 0.12);
      ctx.lineWidth = 1.5 * DPR;
      const bands = 6;
      for (let i = 0; i < bands; i++) {
        ctx.beginPath();
        const yBase = (h / (bands + 1)) * (i + 1);
        for (let x = 0; x <= w; x += 10 * DPR) {
          const yy = yBase
            + Math.sin(x * 0.005 + t * 1.1 + i) * 7 * DPR
            + Math.cos(x * 0.002 + t * 0.6 + i * 0.7) * 4 * DPR;
          if (x === 0) ctx.moveTo(x, yy); else ctx.lineTo(x, yy);
        }
        ctx.stroke();
      }
    }

    /* === Rising bubbles === */
    for (const b of bubbles) {
      b.y -= b.speed;
      b.x += Math.sin(t * b.sway + b.swayPhase) * 0.5 * DPR;
      if (b.y + b.r < -10) { b.y = h + Math.random() * 20; b.x = Math.random() * w; }
      const g = ctx.createRadialGradient(b.x - b.r * 0.3, b.y - b.r * 0.3, 0, b.x, b.y, b.r * 1.6);
      g.addColorStop(0,   rgba(theme.foam, Math.min(0.9, b.alpha * 1.8)));
      g.addColorStop(0.5, rgba(theme.bubble, b.alpha * 0.6));
      g.addColorStop(1,   rgba(theme.bubble, 0));
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r * 1.6, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = rgba(theme.foam, b.alpha * 0.5);
      ctx.beginPath();
      ctx.arc(b.x - b.r * 0.35, b.y - b.r * 0.35, b.r * 0.35, 0, Math.PI * 2);
      ctx.fill();
    }

    /* === Foam crests at top (banner mode only) === */
    if (mode === 'banner') {
      for (const p of foam) {
        const yy = p.cy + Math.sin(t * p.speed + p.phase) * p.bob * DPR;
        const xx = p.cx + Math.cos(t * p.speed * 0.7 + p.phase) * 5 * DPR;
        const g = ctx.createRadialGradient(xx, yy, 0, xx, yy, p.r);
        g.addColorStop(0,   rgba(theme.foam, p.alpha * 1.4));
        g.addColorStop(0.5, rgba(theme.bubble, p.alpha * 0.7));
        g.addColorStop(1,   rgba(theme.bubble, 0));
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(xx, yy, p.r, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    /* === Sparkles === */
    for (let i = 0; i < sparks.length; i++) {
      const s = sparks[i];
      const sx = (Math.sin(t * 0.25 + s.ph) * 0.5 + 0.5) * w;
      const sy = (Math.cos(t * 0.20 + s.phY) * 0.5 + 0.5) * h;
      const a = Math.max(0, 0.10 + 0.20 * Math.sin(t * 1.5 + i));
      ctx.fillStyle = rgba(theme.sparkle, a);
      ctx.beginPath();
      ctx.arc(sx, sy, 1.2 * DPR, 0, Math.PI * 2);
      ctx.fill();
    }

    releaseClip();
  }

  const item = { canvas, draw };
  _liquidCanvases.add(item);
  _ensureLiquidLoop();

  return {
    stop() {
      _liquidCanvases.delete(item);
      if (_ro) { try { _ro.disconnect(); } catch(_){} }
    }
  };
}

/* Modal banner: keep the static gradient as background, animate bubbles on top */
let _modalShaderHandle = null;
function paintModalShader(theme) {
  const el = document.getElementById('modalShader');
  if (!el) return;
  const grads = {
    cb: 'linear-gradient(135deg, #F1DCA0 0%, #E8C76D 35%, #C8842E 100%)',
    mc: 'linear-gradient(135deg, #DCE7EE 0%, #9DB3C4 50%, #5F7A8F 100%)',
    neutral: 'linear-gradient(135deg, #F1DCA0 0%, #C9D2BD 50%, #DDD0B8 100%)',
    pos: 'linear-gradient(135deg, #D7E0CB 0%, #8B9A7B 100%)',
    neg: 'linear-gradient(135deg, #F0D2CE 0%, #B5564E 100%)'
  };
  el.style.background = grads[theme] || grads.neutral;

  /* Ensure the canvas exists */
  let canvas = el.querySelector('canvas.modal-liquid');
  if (!canvas) {
    canvas = document.createElement('canvas');
    canvas.className = 'modal-liquid';
    canvas.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;pointer-events:none;mix-blend-mode:screen;';
    el.style.position = 'relative';
    el.appendChild(canvas);
  }
  if (_modalShaderHandle) _modalShaderHandle.stop();
  _modalShaderHandle = paintLiquidShader(canvas, { theme: theme === 'pos' || theme === 'neg' ? theme : (theme === 'cb' || theme === 'mc' ? theme : 'neutral'), mode: 'banner', alpha: 0.85 });
}

/* Story card icon: convert the circular badge into an animated liquid vessel */
function activateStoryIconShaders() {
  const icons = document.querySelectorAll('.story-icon canvas.story-icon-liquid');
  if (icons.length === 0) {
    /* First-time activation: inject a canvas into each .story-icon */
    document.querySelectorAll('.story-icon').forEach((icon) => {
      if (icon.querySelector('canvas.story-icon-liquid')) return;
      const cv = document.createElement('canvas');
      cv.className = 'story-icon-liquid';
      cv.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;border-radius:50%;pointer-events:none;mix-blend-mode:screen;opacity:0.95;';
      icon.style.position = 'relative';
      /* Place canvas behind the svg so the icon stroke stays sharp on top */
      const svg = icon.querySelector('svg');
      if (svg) {
        icon.insertBefore(cv, svg);
        svg.style.position = 'relative';
        svg.style.zIndex = '2';
      } else {
        icon.appendChild(cv);
      }
      /* Pick theme by position in the story-card flow: cb-flavored for intro, neutral otherwise */
      const card = icon.closest('.story-card');
      const t = card && card.classList.contains('intro') ? 'cb' : 'neutral';
      paintLiquidShader(cv, { theme: t, mode: 'circle', bubbles: 16, sparkles: 6, alpha: 1.0 });
    });
  }
}

function openInsight(theme, eyebrow, title, meta, sections) {
  paintModalShader(theme);
  const body = document.getElementById('modalBody');
  const metaHtml = meta.map(m => {
    // accept either string OR { label, val }
    if (typeof m === 'string') return `<div class="modal-meta-item">${m}</div>`;
    return `<div class="modal-meta-item">${m.label}: <strong>${m.val}</strong></div>`;
  }).join('');
  const sectionsHtml = sections.map(s => `
    <div class="modal-section">
      <div class="modal-section-title">${s.heading}</div>
      <p class="modal-section-text">${s.body || s.text || ''}</p>
    </div>`).join('');
  body.innerHTML = `
    <div class="modal-eyebrow">${eyebrow}<span class="ai-badge">AI Insight</span></div>
    <h3 class="modal-title">${title}</h3>
    <div class="modal-meta">${metaHtml}</div>
    ${sectionsHtml}
  `;
  document.getElementById('modalBackdrop').classList.add('open');
}
function closeModal() { document.getElementById('modalBackdrop').classList.remove('open'); }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

  { id: 'overview',   label: 'Overview',          num: '01' },

function buildNav() {
  const html = `<div class="tab-nav-wrap"><div class="tab-nav">
    ${TABS.map((t,i) => `<button class="tab-btn ${i===0?'active':''}" data-tab="${t.id}" onclick="switchTab('${t.id}')">
      <span class="tab-num">${t.num}</span>${t.label}
    </button>`).join('')}
  </div></div>`;
  document.getElementById('nav-placeholder').innerHTML = html;
}

function switchTab(id) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === id));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('active', p.id === 'tab-' + id));
  window.scrollTo({ top: document.querySelector('.tab-nav-wrap').offsetTop - 4, behavior: 'smooth' });
  // Initialize charts lazily
  if (!loadedTabs.has(id)) {
    setTimeout(() => initTab(id), 50);
    loadedTabs.add(id);
  }
  // Make sure any newly-visible story icons get their shader
  setTimeout(() => { if (typeof activateStoryIconShaders === 'function') activateStoryIconShaders(); }, 100);
}

/* Animated counter */
function animateCounter(el, target, decimals = 0, duration = 1400) {
  const start = performance.now();
  const startVal = 0;
  function step(now) {
    const t = Math.min(1, (now - start) / duration);
    const eased = 1 - Math.pow(1 - t, 3);
    const val = startVal + (target - startVal) * eased;
    el.textContent = decimals ? val.toFixed(decimals) : Math.round(val).toLocaleString('en-US');
    if (t < 1) requestAnimationFrame(step);
    else el.textContent = decimals ? target.toFixed(decimals) : target.toLocaleString('en-US');
  }
  requestAnimationFrame(step);
}
function animateAllCounters() {
  document.querySelectorAll('[data-count]').forEach(el => {
    const target = parseFloat(el.dataset.count);
    const dec = parseInt(el.dataset.decimal || '0');
    animateCounter(el, target, dec);
  });
}

        tooltip: { backgroundColor: '#2C2419', callbacks: { label: (c) => c.dataset.label + ': ' + c.parsed.y + 'M audience' } }
      },
      scales: {
        y: { grid: { color: 'rgba(140,121,91,0.12)' }, ticks: { callback: (v) => v + 'M' } },
        x: { grid: { display: false } }
      }
    }
  });

  /* ---- Interactions bar chart ---- */
  destroyChart('chartInteractions');
  chartRegistry.chartInteractions = new Chart(document.getElementById('chartInteractions'), {
    type: 'bar',
    data: {
      labels: DATA.weekly.labels,
      datasets: [
        { label: 'CB', data: DATA.weekly.cb_interactions, backgroundColor: PALETTE.cb, borderRadius: 6, maxBarThickness: 22 },
        { label: 'MC', data: DATA.weekly.mc_interactions, backgroundColor: PALETTE.mc, borderRadius: 6, maxBarThickness: 22 }
      ]
    },
    options: {
      plugins: {
        legend: { position: 'bottom', labels: { usePointStyle: true, padding: 12 } },
        tooltip: { backgroundColor: '#2C2419', callbacks: { label: (c) => c.dataset.label + ': ' + c.parsed.y.toLocaleString() + ' interactions' } }
      },
      scales: {
        y: { grid: { color: 'rgba(140,121,91,0.12)' }, ticks: { callback: (v) => v >= 1000 ? (v/1000) + 'K' : v } },
        x: { grid: { display: false } }
      }
    }
  });

  /* ---- Week cards scrubber ---- */
  const wcRow = document.getElementById('weekCardsRow');
  wcRow.innerHTML = DATA.weekStories.map((s, i) => `
    <div class="week-card" data-i="${i}">
      <div class="wlbl">${s.week}</div>
      <div class="wval">${(s.cb_m + s.mc_m).toLocaleString()}</div>
    </div>
  `).join('');
  wcRow.querySelectorAll('.week-card').forEach(c => {
    c.addEventListener('click', () => selectWeek(parseInt(c.dataset.i)));
  });

  /* default to peak combined week */
  let peak = 0, peakSum = 0;
  DATA.weekStories.forEach((s, i) => {
    if (s.cb_m + s.mc_m > peakSum) { peakSum = s.cb_m + s.mc_m; peak = i; }
  });
  selectWeek(peak);
}

  document.querySelectorAll('#weekCardsRow .week-card').forEach(c => c.classList.toggle('active', parseInt(c.dataset.i) === i));
  const s = DATA.weekStories[i];
  document.getElementById('weekDetail').innerHTML = `

}

/* ============================================================
   TAB 3 — CHANNEL MIX
   ============================================================ */
function initChannels() {
  if (tabInitState.channels) return;
  tabInitState.channels = true;

  const makeMix = (canvasId, brand, colors) => {
    destroyChart(canvasId);
    chartRegistry[canvasId] = new Chart(document.getElementById(canvasId), {
      type: 'doughnut',
      data: {
        labels: DATA.mediaMix[brand].map(c => c.name),
        datasets: [{
          data: DATA.mediaMix[brand].map(c => c.mentions),
          backgroundColor: colors,
          borderColor: '#FEFCF7', borderWidth: 3, hoverOffset: 14
        }]
      },
      options: {
        cutout: '62%',
        plugins: {
          legend: { position: 'bottom', labels: { boxWidth: 10, usePointStyle: true, padding: 10, font: { size: 11 } } },
          tooltip: {
            backgroundColor: '#2C2419', padding: 12, cornerRadius: 8,
            callbacks: {
              label: (c) => {
                const item = DATA.mediaMix[brand][c.dataIndex];
                return [c.label, item.mentions.toLocaleString() + ' mentions', item.share + '% share', fmt.short(item.audience) + ' audience'];
              }
            }
          }
        },
        onClick: (e, els) => {
          if (!els.length) return;
          const item = DATA.mediaMix[brand][els[0].index];
          const key = item.name + '_' + brand;
          const insight = DATA.channelInsights[key];
          if (!insight) return;
          openInsight(brand, brand === 'cb' ? 'CB · ' + item.name : 'MC · ' + item.name,
            item.name + ' performance',
            [
              { label: 'Mentions', val: item.mentions.toLocaleString() },
              { label: 'Audience', val: fmt.short(item.audience) },
              { label: 'Eng. Rate', val: insight.rate.toFixed(2) + '/K' }
            ],
            [
              { heading: 'What\'s happening', body: insight.story },
              { heading: 'Leading sub-brands', body: insight.leaders }
            ]);
        },
        onHover: (e, els) => { e.native.target.style.cursor = els.length ? 'pointer' : 'default'; }
      }
    });
  };

  makeMix('chartCBmedia', 'cb', CB_CHANNEL_COLORS);
  makeMix('chartMCmedia', 'mc', MC_CHANNEL_COLORS);

  /* ---- Channel flip cards ---- */
  const channelIconMap = {
    'Facebook': { cls: 'ch-fb', svg: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M22 12c0-5.523-4.477-10-10-10S2 6.477 2 12c0 4.99 3.657 9.128 8.438 9.878v-6.987h-2.54V12h2.54V9.797c0-2.506 1.492-3.89 3.777-3.89 1.094 0 2.238.195 2.238.195v2.46h-1.26c-1.243 0-1.63.771-1.63 1.562V12h2.773l-.443 2.89h-2.33v6.988C18.343 21.128 22 16.991 22 12z"/></svg>' },
    'Instagram': { cls: 'ch-ig', svg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/></svg>' },
    'X (Twitter)': { cls: 'ch-tw', svg: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>' },
    'Tv': { cls: 'ch-tv', svg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="13" rx="2"/><polyline points="8 22 12 19 16 22"/></svg>' },
    'Tiktok': { cls: 'ch-tt', svg: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 5.81 20.93a6.33 6.33 0 0 0 10.86-4.43V9.05a8.31 8.31 0 0 0 4.92 1.59V7.21a4.79 4.79 0 0 1-2-.52z"/></svg>' },
    'Linkedin': { cls: 'ch-li', svg: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 01-2.063-2.065 2.063 2.063 0 112.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>' },
    'Radio': { cls: 'ch-rd', svg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h6m6 0h6M12 3v6m0 6v6"/></svg>' },
    'Video': { cls: 'ch-vd', svg: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>' }
  };

  const buildChannelCards = (containerId, brand) => {
    const container = document.getElementById(containerId);
    const cards = DATA.mediaMix[brand].slice(0, 8);
    const maxInteractions = Math.max(...cards.map(c => c.interactions));
    /* For broadcast cards, scale the bar by reach-per-mention */
    const broadcastReach = cards.filter(c => c.interactions === 0).map(c => c.audience / c.mentions);
    const maxBroadcastReach = broadcastReach.length ? Math.max(...broadcastReach) : 1;

    container.innerHTML = cards.map((ch, i) => {
      const ic = channelIconMap[ch.name] || channelIconMap['Tv'];
      const key = ch.name + '_' + brand;
      const insight = DATA.channelInsights[key] || { rate: 0, story: '', leaders: '' };
      const displayName = ch.name === 'Tv' ? 'TV' : ch.name === 'Tiktok' ? 'TikTok' : ch.name === 'Linkedin' ? 'LinkedIn' : ch.name;

      /* Pick the right headline metric per channel type */
      const isBroadcast = ch.interactions === 0;
      let statValue, statUnit, statContext, statLabel, fillPct;

      if (isBroadcast) {
        const reachPerMention = ch.audience / ch.mentions;
        statValue = fmt.short(reachPerMention);
        statUnit = '/ mention';
        statLabel = 'Avg Reach';
        statContext = `${fmt.short(ch.audience)} total reach across ${ch.mentions.toLocaleString()} broadcast mentions`;
        fillPct = maxBroadcastReach > 0 ? Math.min(100, (reachPerMention / maxBroadcastReach) * 100) : 0;
      } else {
        statValue = (ch.interactions / ch.mentions).toFixed(1);
        statUnit = '/ mention';
        statLabel = 'Engagement';
        statContext = `${ch.interactions.toLocaleString()} interactions across ${ch.mentions.toLocaleString()} posts`;
        fillPct = maxInteractions > 0 ? Math.min(100, (ch.interactions / maxInteractions) * 100) : 0;
      }

      return `
        <div class="channel-card" data-brand="${brand}" data-idx="${i}">
          <div class="ch-inner">
            <div class="ch-face ch-front">
              <div class="ch-front-top">
                <div class="ch-icon ${ic.cls}">${ic.svg}</div>
                <div style="display:flex;align-items:center;gap:6px;">
                  <div class="ch-brand-pill ${brand}">${brand.toUpperCase()}</div>
                  <div class="ch-flip-hint">Flip →</div>
                </div>
              </div>
              <div>
                <div class="ch-name">${displayName}</div>
                <div class="ch-share"><strong>${ch.mentions.toLocaleString()}</strong> mentions · ${ch.share}%</div>
                <div class="ch-share" style="margin-top:4px;">${fmt.short(ch.audience)} audience</div>
              </div>
            </div>
            <div class="ch-face ch-back ${brand}-back">
              <div class="ch-back-flip-hint">← Flip</div>
              <div>
                <div class="ch-back-title">${brand.toUpperCase()} · ${displayName} · ${statLabel}</div>
                <div class="ch-back-stat">${statValue}<em>${statUnit}</em></div>
                <div class="ch-back-sub">${statContext}</div>
              </div>
              <div>
                <div class="ch-back-bar"><div class="ch-back-bar-fill" style="width:${fillPct}%;"></div></div>
                <div class="ch-back-detail">${insight.leaders ? 'Leaders: <strong>' + insight.leaders + '</strong>' : '—'}</div>
              </div>
            </div>
          </div>
        </div>
      `;
    }).join('');
    container.querySelectorAll('.channel-card').forEach(c => {
      c.addEventListener('click', () => c.classList.toggle('flipped'));
    });
  };

  buildChannelCards('channelGridCB', 'cb');
  buildChannelCards('channelGridMC', 'mc');
}

/* ============================================================
   TAB 4 — SENTIMENT
   ============================================================ */
function initSentiment() {
  if (tabInitState.sentiment) return;
  tabInitState.sentiment = true;

  /* Pulse meters */
  const makePulse = (id, brand) => {
    destroyChart(id);
    const k = DATA.kpis[brand];
    chartRegistry[id] = new Chart(document.getElementById(id), {
      type: 'doughnut',
      data: {
        labels: ['Positive', 'Neutral', 'Negative'],
        datasets: [{
          data: [k.positive, k.neutral, k.negative],
          backgroundColor: [PALETTE.pos, PALETTE.neu, PALETTE.neg],
          borderColor: '#FEFCF7', borderWidth: 4,
          hoverOffset: 8
        }]
      },
      options: {
        cutout: '72%',
        plugins: {
          legend: { display: false },
          tooltip: {
            backgroundColor: '#2C2419', padding: 10,
            callbacks: { label: (c) => c.label + ': ' + c.parsed.toLocaleString() + ' (' + ((c.parsed / k.mentions) * 100).toFixed(1) + '%)' }
          }
        }
      }
    });
  };
  makePulse('pulseCB', 'cb');
  makePulse('pulseMC', 'mc');

  /* Sentiment by media (stacked, toggleable) */
  setSentBrand('cb');

  /* Quote tabs */
  const tabs = [
    { key: 'cb_pos', label: 'CB · Positive', brand: 'cb' },
    { key: 'cb_neg', label: 'CB · Critical', brand: 'cb' },
    { key: 'mc_pos', label: 'MC · Positive', brand: 'mc' },
    { key: 'mc_neg', label: 'MC · Critical', brand: 'mc' }
  ];
  document.getElementById('quoteTabs').innerHTML = tabs.map((t, i) =>
    `<button class="quote-tab ${i === 0 ? 'active' : ''}" data-key="${t.key}">${t.label}</button>`
  ).join('');
  document.querySelectorAll('#quoteTabs .quote-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('#quoteTabs .quote-tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderQuotes(btn.dataset.key);
    });
  });
  renderQuotes('cb_pos');
}

function renderQuotes(key) {
  const list = QUOTES[key] || [];
  const sentMap = { pos: 'Positive', neg: 'Critical', neu: 'Neutral' };
  document.getElementById('quoteContent').innerHTML = list.map(q => `
    <div class="quote-card">
      <div class="quote-text">"${q.text}"</div>
      <div class="quote-meta">
        <div class="quote-source">${q.source} · ${q.meta}</div>
        <span class="quote-pill qt-${q.sentiment}">${sentMap[q.sentiment]}</span>
      </div>
    </div>
  `).join('');
}

function setSentBrand(brand) {
  document.querySelectorAll('[data-sentbrand]').forEach(b => b.classList.toggle('active', b.dataset.sentbrand === brand));
  destroyChart('chartSentByMedia');
  const rows = DATA.sentByMedia[brand];
  chartRegistry.chartSentByMedia = new Chart(document.getElementById('chartSentByMedia'), {
    type: 'bar',
    data: {
      labels: rows.map(r => r.media === 'Tv' ? 'TV' : r.media === 'Tiktok' ? 'TikTok' : r.media === 'Linkedin' ? 'LinkedIn' : r.media),
      datasets: [
        { label: 'Positive', data: rows.map(r => r.positive), backgroundColor: PALETTE.pos, borderRadius: 6, stack: 's' },
        { label: 'Neutral', data: rows.map(r => r.neutral), backgroundColor: PALETTE.neu, borderRadius: 6, stack: 's' },
        { label: 'Negative', data: rows.map(r => r.negative), backgroundColor: PALETTE.neg, borderRadius: 6, stack: 's' }
      ]
    },
    options: {
      indexAxis: 'y',
      plugins: {
        legend: { position: 'bottom', labels: { usePointStyle: true, padding: 14 } },
        tooltip: { backgroundColor: '#2C2419' }
      },
      scales: {
        x: { stacked: true, grid: { color: 'rgba(140,121,91,0.12)' } },
        y: { stacked: true, grid: { display: false } }
      }
    }
  });
}

/* ============================================================
   TAB 5 — SUB-BRAND ATLAS
   ============================================================ */
function initSubbrands() {
  if (tabInitState.subbrands) return;
  tabInitState.subbrands = true;

  /* Render bubbles */
  const canvas = document.getElementById('bubbleCanvas');
  const all = [...DATA.subBrands.cb.map(s => ({...s, brand:'cb'})), ...DATA.subBrands.mc.map(s => ({...s, brand:'mc'}))];
  /* size scale: max 1998 -> ~150px diameter; min ~50px */
  const maxSize = 1998;
  const px = (size) => 50 + (size / 180) * 100; /* size is already normalized in DATA */
  canvas.innerHTML = all.map((b, i) => {
    const d = Math.max(56, Math.min(160, 50 + (b.mentions / maxSize) * 130));
    return `
      <div class="bubble ${b.brand}-b" data-i="${i}" data-brand="${b.brand}"
           style="width:${d}px;height:${d}px;left:calc(${b.x}% - ${d/2}px);top:calc(${b.y}% - ${d/2}px);font-size:${Math.max(10, d/9)}px;">
        <div class="bubble-name">${b.name}</div>
        <div class="bubble-num">${b.mentions.toLocaleString()}</div>
      </div>
    `;
  }).join('');

  const showBubble = (idx) => {
    document.querySelectorAll('#bubbleCanvas .bubble').forEach(b => b.classList.toggle('active', parseInt(b.dataset.i) === idx));
    const b = all[idx];
    const isCB = b.brand === 'cb';
    const initial = b.name.charAt(0);
    document.getElementById('bubbleDetail').innerHTML = `
      <div class="bd-icon" style="background: ${isCB ? 'linear-gradient(160deg, var(--gold-light), var(--cb))' : 'linear-gradient(160deg, var(--mc-soft), var(--mc))'}; color:#FEFCF7; font-family:'Fraunces',serif; font-size:28px; font-weight:500;">${initial}</div>
      <div>
        <div style="font-size:10px;letter-spacing:0.18em;text-transform:uppercase;color:${isCB ? 'var(--amber-deep)' : 'var(--mc)'};font-weight:600;">${isCB ? 'Constellation Brands' : 'Molson Coors'}</div>
        <h4 style="font-family:'Fraunces',serif;font-size:24px;font-weight:500;margin:6px 0 4px;letter-spacing:-0.01em;">${b.name} <em style="font-style:italic;font-family:'Instrument Serif',serif;color:var(--sand);font-size:18px;">— ${b.tagline}</em></h4>
        <p style="font-size:13px;line-height:1.65;color:var(--coffee);margin:8px 0 0;">${b.story}</p>
      </div>
      <div style="text-align:right;">
        <div style="font-size:9px;letter-spacing:0.18em;text-transform:uppercase;color:var(--sand);">Mentions</div>
        <div style="font-family:'Fraunces',serif;font-size:32px;font-weight:500;color:var(--espresso);line-height:1;">${b.mentions.toLocaleString()}</div>
        <div style="font-size:11px;color:var(--coffee);margin-top:6px;">${fmt.short(b.audience)} audience</div>
        <div style="font-size:11px;color:var(--coffee);">${b.interactions.toLocaleString()} interactions</div>
        <div style="display:flex;gap:8px;margin-top:10px;justify-content:flex-end;font-size:10px;">
          <span style="background:var(--pos-light);color:var(--sage-deep);padding:3px 8px;border-radius:99px;">+${b.positive}</span>
          <span style="background:var(--neg-light);color:var(--berry);padding:3px 8px;border-radius:99px;">−${b.negative}</span>
        </div>
      </div>
    `;
  };

  canvas.querySelectorAll('.bubble').forEach(el => {
    el.addEventListener('click', () => showBubble(parseInt(el.dataset.i)));
  });
  /* default to Modelo (idx 0) */
  showBubble(0);

  /* Leaderboard chart */
  const leader = [...all].sort((a,b) => b.mentions - a.mentions).slice(0, 10);
  destroyChart('chartSubLeader');
  chartRegistry.chartSubLeader = new Chart(document.getElementById('chartSubLeader'), {
    type: 'bar',
    data: {
      labels: leader.map(b => b.name),
      datasets: [{
        data: leader.map(b => b.mentions),
        backgroundColor: leader.map(b => b.brand === 'cb' ? PALETTE.cb : PALETTE.mc),
        borderRadius: 8, maxBarThickness: 22
      }]
    },
    options: {
      indexAxis: 'y',
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: '#2C2419', padding: 12,
          callbacks: {
            label: (c) => leader[c.dataIndex].mentions.toLocaleString() + ' mentions',
            afterLabel: (c) => fmt.short(leader[c.dataIndex].audience) + ' audience'
          }
        }
      },
      scales: {
        x: { grid: { color: 'rgba(140,121,91,0.12)' } },
        y: { grid: { display: false } }
      },
      onClick: (e, els) => {
        if (!els.length) return;
        const b = leader[els[0].index];
        openInsight(b.brand, (b.brand === 'cb' ? 'CB · ' : 'MC · ') + b.name, b.tagline,
          [
            { label: 'Mentions', val: b.mentions.toLocaleString() },
            { label: 'Audience', val: fmt.short(b.audience) },
            { label: 'Interactions', val: b.interactions.toLocaleString() }
          ],
          [{ heading: 'The 90-day story', body: b.story }]);
      },
      onHover: (e, els) => { e.native.target.style.cursor = els.length ? 'pointer' : 'default'; }
    }
  });
}

      <div class="moment-rank">#${m.rank}</div>
      <div class="moment-channel"><div class="b-dot"></div>${m.channel}</div>
      <h4 class="moment-title">${m.title}</h4>
      <div class="moment-meta">
        <div class="moment-meta-item"><div class="v">${m.audience}</div><div class="l">Reach</div></div>
        <div class="moment-meta-item"><div class="v">${m.interactions.toLocaleString()}</div><div class="l">Interactions</div></div>
        <div class="moment-meta-item"><div class="v">${m.sentiment}</div><div class="l">Tone</div></div>
      </div>
    </div>
  `).join('');
  grid.querySelectorAll('.moment-card').forEach(card => {
    card.addEventListener('click', () => {
      const m = DATA.topMoments[parseInt(card.dataset.i)];
      openInsight(m.brand, '#' + m.rank + ' Moment · ' + m.channel, m.title,
        [
          { label: 'Reach', val: m.audience },
          { label: 'Interactions', val: m.interactions.toLocaleString() },
          { label: 'Tone', val: m.sentiment }
        ],
        [
          { heading: 'What happened', body: m.detail },
          { heading: 'What it means', body: m.meaning }
        ]);
    });
  });

  /* Quiz */
  initQuiz();
}

const QUIZ = [
  {
    q: 'Which channel produces Constellation\'s <em>highest</em> engagement rate per mention?',
    options: ['TV', 'Facebook', 'TikTok', 'Instagram'],
    correct: 2,
    rationale: 'TikTok generates 18.6K interactions on just 235 posts — a 79 interactions/mention rate, driven by the "cold brew" Corona crossover.'
  },
  {
    q: 'Who recorded the <em>biggest engagement week</em> of the period — and when?',
    options: ['CB · Apr 20', 'MC · Mar 23', 'MC · Apr 27', 'CB · Mar 16'],
    correct: 2,
    rationale: 'Molson Coors hit 23,153 interactions in the week of Apr 27 (Cheez-It collab leak + $15 beer affordability thread).'
  },
  {
    q: 'How many mentions did <em>Modelo</em> generate across the 90 days?',
    options: ['1,137', '1,656', '1,998', '2,310'],
    correct: 2,
    rationale: 'Modelo led the entire category with 1,998 mentions and 363M audience. Closest competitor: Coors (1,656).'
  },
  {
    q: 'Which cultural moment achieved <em>17.1M reach</em>?',

    correct: 1,
    rationale: 'The SNL Weekend Update segment on Coors NA delivered 17.1M video reach and 12,615 interactions — the period\'s biggest single-moment reach.'
  },
  {
    q: 'The viral $15-beer affordability thread drove how much audience reach?',
    options: ['180K', '420K', '1.3M', '4.8M'],
    correct: 2,
    rationale: '1.3M reach with 3,207 interactions — reframing Gen Z drinking decline as an affordability story (not sobriety).'
  }
];

function initQuiz() {
  let idx = 0, score = 0, completed = false;

  function render() {
    const q = QUIZ[idx];
    document.getElementById('quizProgress').innerHTML = QUIZ.map((_, i) =>
      `<div class="qp-step ${i < idx ? 'done' : i === idx ? 'current' : ''}"></div>`
    ).join('');
    document.getElementById('quizArea').innerHTML = `
      <div class="quiz-question">Question ${idx + 1} of ${QUIZ.length} — ${q.q}</div>
      <div class="quiz-options">
        ${q.options.map((o, i) => `<div class="quiz-opt" data-i="${i}">${o}</div>`).join('')}
      </div>
    `;
    document.querySelectorAll('#quizArea .quiz-opt').forEach(el => {
      el.addEventListener('click', () => answer(parseInt(el.dataset.i), el));
    });
  }

  function answer(picked, el) {
    if (el.classList.contains('disabled')) return;
    const q = QUIZ[idx];
    document.querySelectorAll('#quizArea .quiz-opt').forEach(o => o.classList.add('disabled'));
    if (picked === q.correct) {
      el.classList.add('correct');
      score++;
      document.getElementById('quizScore').textContent = score;
    } else {
      el.classList.add('wrong');
      document.querySelectorAll('#quizArea .quiz-opt')[q.correct].classList.add('correct');
    }
    setTimeout(() => {
      idx++;
      if (idx >= QUIZ.length) finish();
      else render();
    }, 1300);
  }

  function finish() {
    if (completed) return;
    completed = true;
    document.getElementById('quizProgress').innerHTML = QUIZ.map(() => `<div class="qp-step done"></div>`).join('');
    document.getElementById('quizArea').innerHTML = '';
    const tier = score === 5 ? 'Category sage' : score >= 4 ? 'Sharp analyst' : score >= 2 ? 'Solid read' : 'Time to revisit the tabs';
    document.getElementById('quizResult').innerHTML = `
      <div style="font-size:11px;letter-spacing:0.22em;text-transform:uppercase;color:var(--gold);font-weight:600;">Final Score</div>
      <div style="font-family:'Fraunces',serif;font-size:48px;font-weight:500;color:var(--paper);margin:6px 0;letter-spacing:-0.02em;">${score} <em style="font-style:italic;font-family:'Instrument Serif',serif;color:var(--gold);">/ 5</em></div>
      <div style="font-family:'Fraunces',serif;font-size:18px;font-style:italic;color:var(--gold-light);">${tier}</div>
      <div style="font-size:13px;color:rgba(254,252,247,0.75);margin-top:14px;max-width:520px;margin-left:auto;margin-right:auto;line-height:1.7;">You explored 7,155 mentions across 16 channel splits, 17 sub-brands and 9 cultural moments over 90 days. That's the briefing — now go make decisions.</div>
    `;
    document.getElementById('quizResult').classList.add('show');
    if (score >= 3) burstConfetti();
  }

  render();
}

function burstConfetti() {
  const colors = [PALETTE.gold, PALETTE.amber, PALETTE.sage, PALETTE.wine, PALETTE.pos, '#D4A857'];
  const shapes = ['50%', '0', '20%']; /* circle, square, rounded */
  for (let i = 0; i < 80; i++) {
    setTimeout(() => {
      const el = document.createElement('div');
      el.className = 'confetti';
      el.style.left = Math.random() * 100 + 'vw';
      el.style.background = colors[Math.floor(Math.random() * colors.length)];
      el.style.borderRadius = shapes[Math.floor(Math.random() * shapes.length)];
      el.style.width = (5 + Math.random() * 10) + 'px';
      el.style.height = (8 + Math.random() * 8) + 'px';
      el.style.animationDuration = (2 + Math.random() * 2) + 's';
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 4000);
    }, i * 20);
  }
}
